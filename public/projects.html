<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<base href="/">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Projects &amp; Portfolio | Thu Tech com</title>
<meta name="description" content="Browse recent projects delivered by Thu Tech com — websites, software, mobile apps, and business systems." />
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
<link rel="canonical" href="projects.html" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="loading-screen" class="loading-screen">
  <svg class="spin-mark" width="44" height="44" viewBox="0 0 44 44" fill="none">
    <circle cx="22" cy="22" r="18" stroke="#E5E7EB" stroke-width="4"/>
    <path d="M22 4a18 18 0 0 1 18 18" stroke="#2563EB" stroke-width="4" stroke-linecap="round"/>
  </svg>
</div>
<a href="#main" class="skip-link">Skip to content</a>

<main id="main">
<section class="gradient-hero pt-16 pb-16 lg:pt-20 lg:pb-20">
  <div class="container-max text-center reveal">
    <span class="eyebrow">Portfolio</span>
    <h1 class="font-display text-4xl sm:text-5xl font-extrabold mt-5 mb-5">Projects We're Proud Of</h1>
    <p class="text-lg text-[var(--muted)] max-w-2xl mx-auto">A selection of websites, software, and systems we've built for our clients.</p>
  </div>
</section>

<section class="pt-4 pb-2">
  <div class="container-max">
    <div id="project-filters" class="flex flex-wrap gap-3 justify-center reveal">
      <button class="filter-pill active" data-value="all">All</button>
      <button class="filter-pill" data-value="web-application">Websites</button>
      <button class="filter-pill" data-value="business">Software</button>
      <button class="filter-pill" data-value="mobile">Mobile</button>
      <button class="filter-pill" data-value="business">Business</button>
      <button class="filter-pill" data-value="education">Education</button>
    </div>
  </div>
</section>

<section class="section-pad">
  <div class="container-max">
    <div id="projects-grid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </div>
</section>

<section class="section-pad bg-[var(--bg-light)]">
  <div class="container-max text-center reveal">
    <h2 class="font-display text-3xl sm:text-4xl font-bold mb-4">Have a Project in Mind?</h2>
    <p class="text-[var(--muted)] max-w-2xl mx-auto mb-8">Let's discuss how we can bring your idea to life.</p>
    <a href="contact.html" class="btn btn-primary">Start a Project <i data-lucide="arrow-right" class="w-4 h-4"></i></a>
  </div>
</section>
</main>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="js/api-client.js"></script>
<script src="js/main.js"></script>
<script src="js/components.js"></script>
<script>
document.addEventListener("site-content-ready", () => {
  const grid = document.getElementById("projects-grid");

  if (SITE_CONTENT.projects.length === 0) {
    grid.innerHTML = `
      <div class="col-span-full text-center py-16">
        <i data-lucide="folder-open" class="w-12 h-12 text-gray-300 mx-auto mb-4"></i>
        <p class="text-[var(--muted)]">No projects to show yet — check back soon.</p>
      </div>`;
  } else {
    SITE_CONTENT.projects.forEach((p, i) => {
      grid.innerHTML += `
        <a href="/projects/${p.id}" class="card card-hover overflow-hidden block reveal reveal-delay-${(i % 3) + 1}" data-filter="${p.filterTag}">
          <div class="h-44 bg-gradient-to-br from-blue-500 to-blue-700 flex items-center justify-center overflow-hidden">
            <i data-lucide="layout-panel-top" class="w-12 h-12 text-white/70 scale-hover"></i>
          </div>
          <div class="p-6">
            <span class="badge bg-blue-50 text-blue-600 mb-3">${p.category}</span>
            <h3 class="font-display font-semibold text-lg mb-2">${p.name}</h3>
            <p class="text-sm text-[var(--muted)] leading-relaxed mb-4">${p.description}</p>
            <div class="flex flex-wrap gap-2 mb-5">
              ${p.technologies.map(t => `<span class="text-xs font-medium px-2.5 py-1 rounded-full bg-gray-100 text-gray-600">${t}</span>`).join("")}
            </div>
            <span class="text-sm font-semibold text-blue-600 inline-flex items-center gap-1">View Project <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i></span>
          </div>
        </a>`;
    });
  }

  initFilters("#project-filters", "#projects-grid > a, #projects-grid > div");

  initIcons();
  initScrollReveal();
});
</script>
</body>
</html>
