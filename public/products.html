<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<base href="/">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Products | Thu Tech com</title>
<meta name="description" content="Explore Thu Tech com's own software products — Thu Menu, Thu Business, Thu School, Thu Forms, and Thu Certificate." />
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
<link rel="canonical" href="products.html" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="loading-screen" class="loading-screen">
  <svg class="spin-mark" width="44" height="44" viewBox="0 0 44 44" fill="none">
    <circle cx="22" cy="22" r="18" stroke="#E5E7EB" stroke-width="4"/>
    <path d="M22 4a18 18 0 0 1 18 18" stroke="#2563EB" stroke-width="4" stroke-linecap="round"/>
  </svg>
</div>
<a href="#main" class="skip-link">Skip to content</a>

<main id="main">
<section class="gradient-hero pt-16 pb-16 lg:pt-20 lg:pb-20">
  <div class="container-max text-center reveal">
    <span class="eyebrow">Our Products</span>
    <h1 class="font-display text-4xl sm:text-5xl font-extrabold mt-5 mb-5">Software Built by Thu Tech com</h1>
    <p class="text-lg text-[var(--muted)] max-w-2xl mx-auto">Ready-to-use tools we've built and continue to improve — made for businesses, schools, and organizations.</p>
  </div>
</section>

<section class="section-pad">
  <div class="container-max space-y-8" id="products-list"></div>
</section>

<section class="section-pad bg-[var(--bg-light)]">
  <div class="container-max text-center reveal">
    <h2 class="font-display text-3xl sm:text-4xl font-bold mb-4">Need Something More Custom?</h2>
    <p class="text-[var(--muted)] max-w-2xl mx-auto mb-8">If our products don't quite fit, we can build a custom system just for you.</p>
    <a href="contact.html" class="btn btn-primary">Talk to Us <i data-lucide="arrow-right" class="w-4 h-4"></i></a>
  </div>
</section>
</main>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="js/api-client.js"></script>
<script src="js/main.js"></script>
<script src="js/components.js"></script>
<script>
document.addEventListener("site-content-ready", () => {
  const list = document.getElementById("products-list");

  if (SITE_CONTENT.products.length === 0) {
    list.innerHTML = `<div class="text-center py-16"><p class="text-[var(--muted)]">No products to show yet.</p></div>`;
  } else {
    SITE_CONTENT.products.forEach((p, i) => {
      const reversed = i % 2 === 1;
      list.innerHTML += `
        <div class="card p-8 lg:p-10 grid lg:grid-cols-2 gap-10 items-center reveal">
          <div class="${reversed ? 'lg:order-2' : ''}">
            <div class="icon-tile mb-5" data-tone="${i % 3 === 1 ? 'red' : ''}"><i data-lucide="${p.icon}" class="w-7 h-7"></i></div>
            <h2 class="font-display text-2xl font-bold mb-1">${p.name}</h2>
            <p class="text-sm font-medium text-blue-600 mb-4">${p.tagline}</p>
            <p class="text-[var(--muted)] leading-relaxed mb-5">${p.description}</p>
            <ul class="grid sm:grid-cols-2 gap-2 mb-6">
              ${p.features.map(f => `<li class="flex items-center gap-2 text-sm"><i data-lucide="check" class="w-4 h-4 text-blue-600 flex-shrink-0"></i>${f}</li>`).join("")}
            </ul>
            <div class="flex flex-wrap items-center gap-4">
              <span class="badge bg-blue-50 text-blue-600">${p.pricing}</span>
              <div class="flex gap-3">
                <button class="btn btn-outline btn-sm demo-btn" data-name="${p.name}">Request Demo</button>
                <a href="contact.html" class="btn btn-primary btn-sm">Contact Us</a>
              </div>
            </div>
          </div>
          <div class="${reversed ? 'lg:order-1' : ''} rounded-2xl bg-gradient-to-br from-blue-50 to-red-50 aspect-[4/3] flex items-center justify-center border border-gray-100">
            <i data-lucide="${p.icon}" class="w-20 h-20 text-blue-400"></i>
          </div>
        </div>`;
    });
  }

  document.getElementById("products-list").addEventListener("click", (e) => {
    const btn = e.target.closest(".demo-btn");
    if (!btn) return;
    showToast(`Demo request for ${btn.dataset.name} received — we'll be in touch.`);
  });

  initIcons();
  initScrollReveal();
});
</script>
</body>
</html>
