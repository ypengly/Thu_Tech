<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<base href="/">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Solutions | Thu Tech com</title>
<meta name="description" content="Technology solutions for businesses, schools, restaurants, organizations, and individuals from Thu Tech com." />
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
<link rel="canonical" href="solutions.html" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="loading-screen" class="loading-screen">
  <svg class="spin-mark" width="44" height="44" viewBox="0 0 44 44" fill="none">
    <circle cx="22" cy="22" r="18" stroke="#E5E7EB" stroke-width="4"/>
    <path d="M22 4a18 18 0 0 1 18 18" stroke="#2563EB" stroke-width="4" stroke-linecap="round"/>
  </svg>
</div>
<a href="#main" class="skip-link">Skip to content</a>

<main id="main">
<section class="gradient-hero pt-16 pb-16 lg:pt-20 lg:pb-20">
  <div class="container-max text-center reveal">
    <span class="eyebrow">Solutions</span>
    <h1 class="font-display text-4xl sm:text-5xl font-extrabold mt-5 mb-5">The Right Solution, For Who You Are</h1>
    <p class="text-lg text-[var(--muted)] max-w-2xl mx-auto">Different organizations have different needs. Here's how Thu Tech com helps each one.</p>
  </div>
</section>

<section class="section-pad">
  <div class="container-max space-y-6" id="solutions-list"></div>
</section>

<section class="section-pad bg-[var(--bg-light)]">
  <div class="container-max text-center reveal">
    <h2 class="font-display text-3xl sm:text-4xl font-bold mb-4">Don't See Your Category?</h2>
    <p class="text-[var(--muted)] max-w-2xl mx-auto mb-8">We build custom solutions for all kinds of organizations. Let's talk about what you need.</p>
    <a href="contact.html" class="btn btn-primary">Talk to Us <i data-lucide="arrow-right" class="w-4 h-4"></i></a>
  </div>
</section>
</main>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="js/api-client.js"></script>
<script src="js/main.js"></script>
<script src="js/components.js"></script>
<script>
document.addEventListener("site-content-ready", () => {
  const list = document.getElementById("solutions-list");
  SITE_CONTENT.solutions.forEach((sol, i) => {
    const reversed = i % 2 === 1;
    list.innerHTML += `
      <div class="card p-8 lg:p-10 grid lg:grid-cols-3 gap-8 items-center reveal">
        <div class="lg:col-span-1 ${reversed ? 'lg:order-2' : ''}">
          <div class="icon-tile mb-5" data-tone="${i % 3 === 1 ? 'red' : ''}"><i data-lucide="${sol.icon}" class="w-7 h-7"></i></div>
          <h2 class="font-display text-2xl font-bold mb-3">${sol.title}</h2>
          <p class="text-[var(--muted)] leading-relaxed">${sol.description}</p>
        </div>
        <div class="lg:col-span-2 ${reversed ? 'lg:order-1' : ''}">
          <div class="grid sm:grid-cols-2 gap-3">
            ${sol.items.map(it => `
              <div class="flex items-center gap-3 p-4 rounded-xl bg-[var(--bg-light)]">
                <i data-lucide="check" class="w-4 h-4 text-blue-600 flex-shrink-0"></i>
                <span class="text-sm font-medium">${it}</span>
              </div>`).join("")}
          </div>
        </div>
      </div>`;
  });
  initIcons();
  initScrollReveal();
});
</script>
</body>
</html>
