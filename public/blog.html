<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<base href="/">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Blog &amp; News | Thu Tech com</title>
<meta name="description" content="Insights on technology, business, and digital solutions from the Thu Tech com team." />
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
<link rel="canonical" href="blog.html" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="loading-screen" class="loading-screen">
  <svg class="spin-mark" width="44" height="44" viewBox="0 0 44 44" fill="none">
    <circle cx="22" cy="22" r="18" stroke="#E5E7EB" stroke-width="4"/>
    <path d="M22 4a18 18 0 0 1 18 18" stroke="#2563EB" stroke-width="4" stroke-linecap="round"/>
  </svg>
</div>
<a href="#main" class="skip-link">Skip to content</a>

<main id="main">
<section class="gradient-hero pt-16 pb-16 lg:pt-20 lg:pb-20">
  <div class="container-max text-center reveal">
    <span class="eyebrow">Blog &amp; News</span>
    <h1 class="font-display text-4xl sm:text-5xl font-extrabold mt-5 mb-5">Insights From Our Team</h1>
    <p class="text-lg text-[var(--muted)] max-w-2xl mx-auto">Practical thoughts on technology, business, and digital growth.</p>
  </div>
</section>

<section class="pt-6">
  <div class="container-max">
    <div id="blog-featured"></div>
  </div>
</section>

<section class="section-pad">
  <div class="container-max">
    <div class="flex flex-col lg:flex-row gap-4 lg:items-center lg:justify-between mb-10 reveal">
      <div class="relative w-full lg:max-w-sm">
        <i data-lucide="search" class="w-4 h-4 absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
        <input id="blog-search" type="text" placeholder="Search articles..." class="field-input pl-10" />
      </div>
      <div id="blog-categories" class="flex flex-wrap gap-2"></div>
    </div>
    <div id="blog-grid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    <p id="blog-empty" class="text-center text-[var(--muted)] py-16 hidden">No articles match your search — try a different keyword.</p>
  </div>
</section>
</main>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="js/api-client.js"></script>
<script src="js/main.js"></script>
<script src="js/components.js"></script>
<script>
document.addEventListener("site-content-ready", () => {
  function fmtDate(d) {
    return new Date(d + "T00:00:00").toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" });
  }

  const posts = SITE_CONTENT.blog;
  const featured = posts.find(p => p.featured) || posts[0];
  const rest = posts.filter(p => p.id !== featured?.id);

  const featuredEl = document.getElementById("blog-featured");
  if (featured) {
    featuredEl.innerHTML = `
      <a href="/blog/${featured.id}" class="card card-hover overflow-hidden grid md:grid-cols-2 reveal">
        <div class="h-56 md:h-auto bg-gradient-to-br from-blue-600 to-red-500 flex items-center justify-center">
          <i data-lucide="newspaper" class="w-14 h-14 text-white/80"></i>
        </div>
        <div class="p-8 flex flex-col justify-center">
          <span class="badge bg-blue-50 text-blue-600 w-fit mb-4">Featured · ${featured.category}</span>
          <h2 class="font-display text-2xl font-bold mb-3">${featured.title}</h2>
          <p class="text-[var(--muted)] leading-relaxed mb-5">${featured.excerpt}</p>
          <div class="flex items-center gap-3 text-sm text-[var(--muted)]">
            <span>${featured.author}</span><span>·</span><span>${fmtDate(featured.date)}</span>
          </div>
        </div>
      </a>`;
  }

  const categories = ["All", ...new Set(posts.map(p => p.category))];
  const catEl = document.getElementById("blog-categories");
  categories.forEach((c, i) => {
    catEl.innerHTML += `<button class="filter-pill ${i === 0 ? 'active' : ''}" data-cat="${c}">${c}</button>`;
  });

  const grid = document.getElementById("blog-grid");
  const empty = document.getElementById("blog-empty");

  function renderGrid() {
    const activeCat = catEl.querySelector(".filter-pill.active").dataset.cat;
    const q = document.getElementById("blog-search").value.trim().toLowerCase();
    const filtered = rest.filter(p =>
      (activeCat === "All" || p.category === activeCat) &&
      (p.title.toLowerCase().includes(q) || p.excerpt.toLowerCase().includes(q))
    );
    grid.innerHTML = "";
    empty.classList.toggle("hidden", filtered.length > 0);
    filtered.forEach((b, i) => {
      grid.innerHTML += `
        <a href="/blog/${b.id}" class="card card-hover overflow-hidden block reveal reveal-delay-${(i % 3) + 1}">
          <div class="h-40 bg-gradient-to-br from-blue-500 to-blue-700 flex items-center justify-center">
            <i data-lucide="newspaper" class="w-10 h-10 text-white/80"></i>
          </div>
          <div class="p-6">
            <span class="badge bg-blue-50 text-blue-600 mb-3">${b.category}</span>
            <h3 class="font-display font-semibold mb-2 line-clamp-2">${b.title}</h3>
            <p class="text-sm text-[var(--muted)] line-clamp-2 mb-4">${b.excerpt}</p>
            <div class="flex items-center gap-2 text-xs text-[var(--muted)]"><span>${b.author}</span><span>·</span><span>${fmtDate(b.date)}</span></div>
          </div>
        </a>`;
    });
    initIcons();
    initScrollReveal();
  }

  catEl.addEventListener("click", (e) => {
    const btn = e.target.closest(".filter-pill");
    if (!btn) return;
    catEl.querySelectorAll(".filter-pill").forEach(p => p.classList.remove("active"));
    btn.classList.add("active");
    renderGrid();
  });
  document.getElementById("blog-search").addEventListener("input", renderGrid);

  renderGrid();
  initIcons();
  initScrollReveal();
});
</script>
</body>
</html>
