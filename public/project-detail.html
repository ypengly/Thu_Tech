<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<base href="/">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title id="page-title">Project | Thu Tech com</title>
<meta id="page-description" name="description" content="See how Thu Tech com delivered this project." />
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="loading-screen" class="loading-screen">
  <svg class="spin-mark" width="44" height="44" viewBox="0 0 44 44" fill="none">
    <circle cx="22" cy="22" r="18" stroke="#E5E7EB" stroke-width="4"/>
    <path d="M22 4a18 18 0 0 1 18 18" stroke="#2563EB" stroke-width="4" stroke-linecap="round"/>
  </svg>
</div>
<a href="#main" class="skip-link">Skip to content</a>

<main id="main">
<div id="project-content"></div>
<div id="project-loading" class="section-pad text-center text-[var(--muted)]">Loading project…</div>
<div id="project-not-found" class="section-pad hidden">
  <div class="container-max text-center">
    <h1 class="font-display text-3xl font-bold mb-4">Project Not Found</h1>
    <p class="text-[var(--muted)] mb-8">We couldn't find the project you're looking for.</p>
    <a href="/projects.html" class="btn btn-primary">Back to Projects</a>
  </div>
</div>
</main>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="js/api-client.js"></script>
<script src="js/main.js"></script>
<script src="js/components.js"></script>
<script>
document.addEventListener("site-content-ready", async () => {
  const slug = getSlugFromLocation("projects");
  const loadingEl = document.getElementById("project-loading");
  const container = document.getElementById("project-content");

  if (!slug) {
    loadingEl.classList.add("hidden");
    document.getElementById("project-not-found").classList.remove("hidden");
    return;
  }

  let project;
  try {
    const res = await apiGet(`/public/projects/${encodeURIComponent(slug)}`);
    project = res.data;
  } catch (err) {
    loadingEl.classList.add("hidden");
    document.getElementById("project-not-found").classList.remove("hidden");
    return;
  }

  loadingEl.classList.add("hidden");
  document.getElementById("page-title").textContent = project.name + " | Thu Tech com";
  document.getElementById("page-description").setAttribute("content", project.description || "");

  container.innerHTML = `
    <section class="gradient-hero pt-16 pb-16 lg:pt-20 lg:pb-20">
      <div class="container-max reveal">
        <a href="/projects.html" class="inline-flex items-center gap-1.5 text-sm font-semibold text-[var(--muted)] hover:text-blue-600 mb-6"><i data-lucide="arrow-left" class="w-4 h-4"></i> All Projects</a>
        <span class="badge bg-blue-50 text-blue-600 mb-4">${project.category || "Project"}</span>
        <h1 class="font-display text-4xl sm:text-5xl font-extrabold mb-5 max-w-3xl">${project.name}</h1>
        <p class="text-lg text-[var(--muted)] leading-relaxed max-w-2xl mb-6">${project.description || ""}</p>
        <div class="flex flex-wrap gap-2">
          ${(project.technologies || []).map(t => `<span class="text-xs font-medium px-2.5 py-1 rounded-full bg-white border border-gray-200 text-gray-600">${t}</span>`).join("")}
        </div>
      </div>
    </section>

    <section class="section-pad">
      <div class="container-max grid lg:grid-cols-3 gap-10">
        <div class="lg:col-span-2">
          <div class="rounded-2xl bg-gradient-to-br from-blue-600 to-blue-800 aspect-video flex items-center justify-center mb-10 reveal">
            <i data-lucide="layout-panel-top" class="w-16 h-16 text-white/70"></i>
          </div>
          ${project.longDescription ? `<div class="prose-content text-[var(--ink-soft)] leading-relaxed space-y-4 mb-10 reveal"><h2 class="font-display text-2xl font-bold mb-3">About This Project</h2><p>${project.longDescription}</p></div>` : ""}
          ${project.caseStudy ? `<div class="prose-content text-[var(--ink-soft)] leading-relaxed space-y-4 mb-10 reveal"><h2 class="font-display text-2xl font-bold mb-3">Case Study</h2><p>${project.caseStudy}</p></div>` : ""}
          ${project.resultsImpact ? `<div class="card p-6 reveal"><h3 class="font-display font-semibold mb-2 flex items-center gap-2"><i data-lucide="trending-up" class="w-5 h-5 text-blue-600"></i> Results &amp; Impact</h3><p class="text-[var(--muted)] leading-relaxed">${project.resultsImpact}</p></div>` : ""}
        </div>
        <aside class="space-y-4">
          <div class="card p-6 reveal">
            <h3 class="font-display font-semibold mb-4">Project Details</h3>
            <dl class="space-y-3 text-sm">
              ${project.client ? `<div><dt class="text-[var(--muted)]">Client</dt><dd class="font-medium">${project.client}</dd></div>` : ""}
              <div><dt class="text-[var(--muted)]">Category</dt><dd class="font-medium">${project.category || "—"}</dd></div>
              ${project.projectUrl ? `<div><dt class="text-[var(--muted)]">Live Project</dt><dd><a href="${project.projectUrl}" target="_blank" rel="noopener noreferrer" class="font-medium text-blue-600 hover:underline">Visit site <i data-lucide="external-link" class="w-3.5 h-3.5 inline"></i></a></dd></div>` : ""}
            </dl>
          </div>
          <div class="card p-6 text-center reveal">
            <p class="font-semibold mb-1">Have a similar project?</p>
            <p class="text-sm text-[var(--muted)] mb-4">Let's talk about what you need.</p>
            <a href="/contact.html" class="btn btn-primary btn-sm w-full">Start a Project</a>
          </div>
        </aside>
      </div>
    </section>
  `;
  initIcons();
  initScrollReveal();
});
</script>
</body>
</html>
