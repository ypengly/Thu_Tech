<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<base href="/">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title id="page-title">Job Opening | Thu Tech com</title>
<meta id="page-description" name="description" content="View this job opening at Thu Tech com and apply." />
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="loading-screen" class="loading-screen">
  <svg class="spin-mark" width="44" height="44" viewBox="0 0 44 44" fill="none">
    <circle cx="22" cy="22" r="18" stroke="#E5E7EB" stroke-width="4"/>
    <path d="M22 4a18 18 0 0 1 18 18" stroke="#2563EB" stroke-width="4" stroke-linecap="round"/>
  </svg>
</div>
<a href="#main" class="skip-link">Skip to content</a>

<main id="main">
<div id="job-content"></div>
<div id="job-loading" class="section-pad text-center text-[var(--muted)]">Loading job details…</div>
<div id="job-not-found" class="section-pad hidden">
  <div class="container-max text-center">
    <h1 class="font-display text-3xl font-bold mb-4">Position Not Found</h1>
    <p class="text-[var(--muted)] mb-8">This position may have been filled or is no longer open.</p>
    <a href="/careers.html" class="btn btn-primary">Back to Careers</a>
  </div>
</div>
</main>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="js/api-client.js"></script>
<script src="js/main.js"></script>
<script src="js/components.js"></script>
<script>
document.addEventListener("site-content-ready", async () => {
  const slug = getSlugFromLocation("careers");
  const loadingEl = document.getElementById("job-loading");
  const container = document.getElementById("job-content");

  if (!slug) {
    loadingEl.classList.add("hidden");
    document.getElementById("job-not-found").classList.remove("hidden");
    return;
  }

  let job;
  try {
    const res = await apiGet(`/public/careers/${encodeURIComponent(slug)}`);
    job = res.data;
  } catch (err) {
    loadingEl.classList.add("hidden");
    document.getElementById("job-not-found").classList.remove("hidden");
    return;
  }

  loadingEl.classList.add("hidden");
  document.getElementById("page-title").textContent = job.title + " | Careers | Thu Tech com";
  document.getElementById("page-description").setAttribute("content", job.description || "");

  const listSection = (title, items) => !items || !items.length ? "" : `
    <div class="mb-8">
      <h2 class="font-display text-xl font-bold mb-3">${title}</h2>
      <ul class="space-y-2">
        ${items.map(i => `<li class="flex gap-2 text-[var(--muted)]"><i data-lucide="check" class="w-4 h-4 text-blue-600 flex-shrink-0 mt-1"></i>${i}</li>`).join("")}
      </ul>
    </div>`;

  container.innerHTML = `
    <section class="gradient-hero pt-16 pb-16 lg:pt-20 lg:pb-20">
      <div class="container-max reveal">
        <a href="/careers.html" class="inline-flex items-center gap-1.5 text-sm font-semibold text-[var(--muted)] hover:text-blue-600 mb-6"><i data-lucide="arrow-left" class="w-4 h-4"></i> All Positions</a>
        <h1 class="font-display text-4xl sm:text-5xl font-extrabold mb-5 max-w-3xl">${job.title}</h1>
        <div class="flex flex-wrap gap-4 text-sm text-[var(--muted)]">
          <span class="inline-flex items-center gap-1.5"><i data-lucide="map-pin" class="w-4 h-4"></i>${job.location || "—"}</span>
          <span class="inline-flex items-center gap-1.5"><i data-lucide="clock" class="w-4 h-4"></i>${job.type || "—"}</span>
          ${job.deadline ? `<span class="inline-flex items-center gap-1.5"><i data-lucide="calendar" class="w-4 h-4"></i>Apply by ${new Date(job.deadline).toLocaleDateString()}</span>` : ""}
        </div>
      </div>
    </section>

    <section class="section-pad">
      <div class="container-max grid lg:grid-cols-3 gap-10">
        <div class="lg:col-span-2 reveal">
          <p class="text-[var(--muted)] leading-relaxed mb-8">${job.description || ""}</p>
          ${listSection("Responsibilities", job.responsibilities)}
          ${listSection("Requirements", job.requirements)}
          ${listSection("Qualifications", job.qualifications)}
          ${listSection("Benefits", job.benefits)}
        </div>
        <aside>
          <form id="job-apply-form" class="card p-6 space-y-4 reveal" novalidate>
            <h3 class="font-display font-semibold text-lg mb-1">Apply for This Role</h3>
            <div>
              <label class="field-label" for="j-name">Full Name <span class="text-red-500">*</span></label>
              <input class="field-input" id="j-name" type="text" required />
              <p class="field-error">Please enter your name.</p>
            </div>
            <div>
              <label class="field-label" for="j-email">Email <span class="text-red-500">*</span></label>
              <input class="field-input" id="j-email" type="email" required />
              <p class="field-error">Please enter a valid email.</p>
            </div>
            <div>
              <label class="field-label" for="j-portfolio">Portfolio / LinkedIn URL</label>
              <input class="field-input" id="j-portfolio" type="url" placeholder="https://" />
            </div>
            <div>
              <label class="field-label" for="j-message">Why are you a good fit? <span class="text-red-500">*</span></label>
              <textarea class="field-input" id="j-message" rows="4" required></textarea>
              <p class="field-error">Please share a short message.</p>
            </div>
            <div>
              <label class="field-label" for="j-resume">Resume / CV</label>
              <input class="field-input" id="j-resume" type="file" accept=".pdf,.doc,.docx" />
            </div>
            <button type="submit" class="btn btn-primary w-full">Submit Application</button>
          </form>
          <div id="job-apply-success" class="card p-8 text-center hidden reveal">
            <div class="icon-tile mx-auto mb-4"><i data-lucide="check-circle-2" class="w-6 h-6"></i></div>
            <h3 class="font-display font-semibold mb-2">Application Received!</h3>
            <p class="text-sm text-[var(--muted)]">We'll be in touch soon.</p>
          </div>
        </aside>
      </div>
    </section>
  `;

  initIcons();
  initScrollReveal();

  const form = document.getElementById("job-apply-form");
  bindLiveValidation(form);
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!validateForm(form)) {
      showToast("Please fill in all required fields correctly.", "alert-triangle");
      return;
    }
    const submitBtn = form.querySelector("button[type=submit]");
    submitBtn.disabled = true;
    submitBtn.textContent = "Submitting…";
    try {
      const formData = new FormData();
      formData.append("name", document.getElementById("j-name").value);
      formData.append("email", document.getElementById("j-email").value);
      formData.append("position", slug);
      formData.append("portfolio", document.getElementById("j-portfolio").value);
      formData.append("message", document.getElementById("j-message").value);
      const resumeFile = document.getElementById("j-resume").files[0];
      if (resumeFile) formData.append("resume", resumeFile);

      const result = await apiPost("/public/careers/apply", formData, { isFormData: true });
      form.classList.add("hidden");
      document.getElementById("job-apply-success").classList.remove("hidden");
      showToast(result.message || "Application submitted!");
    } catch (err) {
      showToast(err.message || "Something went wrong. Please try again.", "alert-triangle");
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Submit Application";
    }
  });
});
</script>
</body>
</html>
