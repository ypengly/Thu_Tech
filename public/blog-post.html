<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<base href="/">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title id="page-title">Article | Thu Tech com</title>
<meta id="page-description" name="description" content="Read the latest from the Thu Tech com blog." />
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="loading-screen" class="loading-screen">
  <svg class="spin-mark" width="44" height="44" viewBox="0 0 44 44" fill="none">
    <circle cx="22" cy="22" r="18" stroke="#E5E7EB" stroke-width="4"/>
    <path d="M22 4a18 18 0 0 1 18 18" stroke="#2563EB" stroke-width="4" stroke-linecap="round"/>
  </svg>
</div>
<a href="#main" class="skip-link">Skip to content</a>

<main id="main">
<div id="post-content"></div>
<div id="post-not-found" class="section-pad hidden">
  <div class="container-max text-center">
    <h1 class="font-display text-3xl font-bold mb-4">Article Not Found</h1>
    <p class="text-[var(--muted)] mb-8">This article may have been moved or removed.</p>
    <a href="blog.html" class="btn btn-primary">Back to Blog</a>
  </div>
</div>
</main>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="js/api-client.js"></script>
<script src="js/main.js"></script>
<script src="js/components.js"></script>
<script>
document.addEventListener("site-content-ready", () => {
  function fmtDate(d) {
    return new Date(d + "T00:00:00").toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" });
  }
  const id = getSlugFromLocation("blog");
  const post = SITE_CONTENT.blog.find(p => p.id === id);
  const container = document.getElementById("post-content");

  if (!post) {
    document.getElementById("post-not-found").classList.remove("hidden");
  } else {
    document.getElementById("page-title").textContent = post.title + " | Thu Tech com";
    document.getElementById("page-description").setAttribute("content", post.excerpt);

    const related = SITE_CONTENT.blog.filter(p => p.id !== post.id).slice(0, 3);

    // Use the real CMS article body (`content`) when the admin has written one.
    // Only fall back to a short placeholder for legacy posts that don't have a body yet.
    const bodyHtml = post.content
      ? `<div class="prose-content text-[var(--ink-soft)] leading-relaxed space-y-5 reveal">${post.content}</div>`
      : `<div class="prose-content text-[var(--ink-soft)] leading-relaxed space-y-5 reveal">
           <p class="text-lg">${post.excerpt || ""}</p>
           <p class="text-sm text-[var(--muted)] italic">Full article content coming soon — this post hasn't been written up yet in the admin dashboard.</p>
         </div>`;

    container.innerHTML = `
      <article class="section-pad">
        <div class="container-max max-w-3xl">
          <a href="/blog.html" class="inline-flex items-center gap-1.5 text-sm font-semibold text-[var(--muted)] hover:text-blue-600 mb-8 reveal"><i data-lucide="arrow-left" class="w-4 h-4"></i> Back to Blog</a>
          <span class="badge bg-blue-50 text-blue-600 mb-4 reveal">${post.category}</span>
          <h1 class="font-display text-3xl sm:text-4xl font-extrabold mb-5 leading-tight reveal">${post.title}</h1>
          <div class="flex items-center gap-3 text-sm text-[var(--muted)] mb-8 reveal">
            <div class="w-9 h-9 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center font-semibold">${post.author.charAt(0)}</div>
            <span>${post.author}</span><span>·</span><span>${fmtDate(post.date)}</span>
          </div>
          <div class="h-64 sm:h-80 rounded-2xl bg-gradient-to-br from-blue-600 to-red-500 flex items-center justify-center mb-10 reveal">
            <i data-lucide="newspaper" class="w-16 h-16 text-white/80"></i>
          </div>
          ${bodyHtml}
          <div class="mt-12 p-6 rounded-2xl bg-[var(--bg-light)] flex flex-wrap items-center justify-between gap-4 reveal">
            <div>
              <p class="font-semibold">Have a project in mind?</p>
              <p class="text-sm text-[var(--muted)]">Let's talk about how we can help.</p>
            </div>
            <a href="/contact.html" class="btn btn-primary btn-sm">Contact Us</a>
          </div>
        </div>
      </article>

      <section class="section-pad bg-[var(--bg-light)]">
        <div class="container-max">
          <h2 class="font-display text-2xl font-bold mb-8 reveal">More Articles</h2>
          <div class="grid sm:grid-cols-3 gap-6">
            ${related.map((b, i) => `
              <a href="/blog/${b.id}" class="card card-hover overflow-hidden block reveal reveal-delay-${i + 1}">
                <div class="h-32 bg-gradient-to-br from-blue-500 to-blue-700 flex items-center justify-center">
                  <i data-lucide="newspaper" class="w-8 h-8 text-white/80"></i>
                </div>
                <div class="p-5">
                  <h3 class="font-display font-semibold text-sm mb-2 line-clamp-2">${b.title}</h3>
                  <p class="text-xs text-[var(--muted)]">${fmtDate(b.date)}</p>
                </div>
              </a>`).join("")}
          </div>
        </div>
      </section>
    `;
    initIcons();
    initScrollReveal();
  }
});
</script>
</body>
</html>
