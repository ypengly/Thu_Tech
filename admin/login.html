<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Login | Thu Tech com</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/css/style.css" />
<link rel="stylesheet" href="css/admin.css" />
</head>
<body class="admin-body">
<div class="min-h-screen flex items-center justify-center gradient-hero px-4">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <span class="brand-mark text-2xl"><span class="b-th">Th</span><span class="b-u">u</span><span class="b-rest"> Tech com</span></span>
      <p class="text-sm text-[var(--muted)] mt-2">Admin Dashboard</p>
    </div>
    <form id="login-form" class="card p-8 space-y-5" novalidate>
      <div id="login-error" class="hidden text-sm text-red-600 bg-red-50 border border-red-100 rounded-lg px-4 py-3"></div>
      <div>
        <label class="field-label" for="l-email">Email</label>
        <input class="field-input" id="l-email" type="email" required autocomplete="username" />
      </div>
      <div>
        <label class="field-label" for="l-password">Password</label>
        <input class="field-input" id="l-password" type="password" required autocomplete="current-password" />
      </div>
      <button type="submit" id="login-btn" class="btn btn-primary w-full">Log In</button>
    </form>
    <p class="text-center text-xs text-[var(--muted)] mt-6"><a href="/index.html" class="hover:text-blue-600">← Back to website</a></p>
  </div>
</div>

<script src="js/api.js"></script>
<script>
  const form = document.getElementById("login-form");
  const errorBox = document.getElementById("login-error");
  const btn = document.getElementById("login-btn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorBox.classList.add("hidden");
    btn.disabled = true;
    btn.textContent = "Logging in…";
    try {
      await adminApi("/auth/login", {
        method: "POST",
        body: { email: document.getElementById("l-email").value, password: document.getElementById("l-password").value }
      });
      window.location.href = "/admin/index.html";
    } catch (err) {
      errorBox.textContent = err.message || "Invalid email or password.";
      errorBox.classList.remove("hidden");
      btn.disabled = false;
      btn.textContent = "Log In";
    }
  });
</script>
</body>
</html>
